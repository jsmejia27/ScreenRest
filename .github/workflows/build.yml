# Builds ScreenRest from source on every push. Signing with SignPath (free for open source) switches on
# once the repo has the SIGNPATH_API_TOKEN secret and SIGNPATH_ORGANIZATION_ID variable (see CODE_SIGNING.md).
# The macOS app is built in a separate job on a Mac runner.
# Pushing a tag like v1.2.0 also publishes a GitHub Release with the Windows installer, portable zip and Store
# package, the macOS dmg and zip, and SHA256SUMS.txt for all of them.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to publish releases on tags

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        shell: powershell
        run: |
          # A v1.2.0 tag builds version 1.2.0 (exe, installer and Store package); other builds keep the version in the source.
          if ($env:GITHUB_REF -like 'refs/tags/v*') { [IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$($env:GITHUB_REF_NAME.Substring(1))`n") }

      - name: Build ScreenRest.exe
        shell: powershell
        run: ./build.ps1

      # ---- 1. Sign the app itself (it is embedded in the installer, so it must be signed first) ----
      - name: Upload unsigned app
        if: env.SIGN == 'true'
        id: app-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: ScreenRest.exe

      - name: Sign app with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ScreenRest
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Use the signed app
        if: env.SIGN == 'true'
        shell: powershell
        run: Copy-Item signed-app/ScreenRest.exe ScreenRest.exe -Force

      # ---- 2. Package the installer and portable zip around the (signed) app, then sign the installer ----
      - name: Build installer and portable zip
        shell: powershell
        run: ./installer/build_setup.ps1

      - name: Upload unsigned installer
        if: env.SIGN == 'true'
        id: setup-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: dist/ScreenRest-Setup-*.exe

      - name: Sign installer with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ScreenRest
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: powershell
        run: Copy-Item signed-setup/*.exe dist/ -Force

      # ---- 3. Microsoft Store package (the Store signs it on upload) ----
      - name: Build Store package (MSIX)
        shell: powershell
        run: |
          $a = @{}
          if ('${{ vars.STORE_IDENTITY_NAME }}') { $a.IdentityName = '${{ vars.STORE_IDENTITY_NAME }}' }
          if ('${{ vars.STORE_PUBLISHER }}') { $a.Publisher = '${{ vars.STORE_PUBLISHER }}' }
          ./store/build_msix.ps1 @a

      - name: Checksums
        shell: powershell
        run: |
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName).Hash, $_.Name } | Tee-Object dist/SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRest-${{ github.sha }}
          path: dist/*

  # macOS menu bar app (mac/): universal binary for Apple silicon and Intel, packaged as .dmg and .zip.
  # Signing and notarization switch on once the repo has these secrets (see mac/README.md):
  #   MACOS_CERT_P12 (base64 of a Developer ID Application .p12), MACOS_CERT_PASSWORD,
  #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (an app-specific password).
  # Without them the app is built and signed ad hoc, as before.
  mac:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; fi

      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != '' && github.event_name != 'pull_request'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build ScreenRest.app, dmg and zip
        run: |
          # Notarize only release tags (it takes a few minutes); other builds are still signed when a certificate is set.
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then unset APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; fi
          ./mac/build.sh --package

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRest-mac-${{ github.sha }}
          path: dist/*

  # On a v* tag: one GitHub Release with the Windows and macOS files and a checksum list covering all of them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ScreenRest-*${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * | awk '{ print toupper($1) "  " $2 }' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          tag='${{ github.ref_name }}'
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "ScreenRest ${tag#v}" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
